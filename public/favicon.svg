<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="waterGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="fishBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Background Bubble Sphere -->
  <circle cx="64" cy="64" r="60" fill="url(#waterGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
  
  <!-- Subtle Caustic Water Glow Arc -->
  <path d="M 26 38 C 44 22, 84 22, 102 38" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
  <path d="M 34 46 C 48 34, 80 34, 94 46" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />

  <!-- Ambient Bubbles -->
  <circle cx="36" cy="42" r="4.5" fill="#e0f2fe" opacity="0.6" />
  <circle cx="34.5" cy="40.5" r="1.5" fill="#ffffff" opacity="0.9" />
  
  <circle cx="94" cy="48" r="3.5" fill="#e0f2fe" opacity="0.5" />
  <circle cx="88" cy="32" r="5" fill="#e0f2fe" opacity="0.4" />
  <circle cx="86.5" cy="30.5" r="1.5" fill="#ffffff" opacity="0.8" />

  <!-- Fish Graphic Group (Centered & Floating) -->
  <g transform="translate(6, 4)">
    <!-- Caudal / Tail Fin -->
    <path d="M 38 60 C 26 46, 16 44, 14 56 C 18 60, 22 62, 14 66 C 16 78, 26 76, 38 62 Z" fill="url(#finGrad)" />
    
    <!-- Dorsal Fin -->
    <path d="M 52 47 C 60 35, 76 37, 80 45 C 70 45, 60 46, 52 47 Z" fill="url(#finGrad)" />
    
    <!-- Ventral / Anal Fin -->
    <path d="M 56 73 C 64 81, 72 79, 74 72 C 66 72, 60 73, 56 73 Z" fill="url(#finGrad)" />

    <!-- Main Fish Body (Streamlined Oval with Snout) -->
    <path d="M 36 61 C 38 47, 62 43, 86 51 C 96 55, 102 61, 96 66 C 76 77, 44 75, 36 61 Z" fill="url(#fishBody)" />

    <!-- Iconic White Marine Stripes with subtle dark borders -->
    <path d="M 72 46 C 76 52, 76 69, 71 74 C 67 74, 67 46, 72 46 Z" fill="url(#stripeGrad)" />
    <path d="M 50 50 C 53 55, 53 67, 49 71 C 46 70, 46 51, 50 50 Z" fill="url(#stripeGrad)" />

    <!-- Pectoral Fin -->
    <path d="M 64 61 C 58 64, 52 70, 56 74 C 62 74, 68 67, 68 62 Z" fill="#38bdf8" opacity="0.85" />

    <!-- Eye -->
    <circle cx="88" cy="57" r="3.5" fill="#0f172a" />
    <circle cx="89.2" cy="56" r="1.3" fill="#ffffff" />
  </g>
</svg>
